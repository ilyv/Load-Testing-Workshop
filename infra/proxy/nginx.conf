worker_processes 1;

events {
  worker_connections 1024;
}

http {
  access_log off;

  # Docker DNS. Upstreams are variables so nginx starts while k6 is not running.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_buffering off;
  proxy_read_timeout 1h;

  server {
    listen 3333;
    location / {
      set $upstream quickpizza:3333;
      proxy_pass http://$upstream;
    }
  }

  server {
    listen 3000;
    location / {
      set $upstream grafana:3000;
      proxy_pass http://$upstream;
    }
  }

  server {
    listen 8428;
    location / {
      set $upstream victoriametrics:8428;
      proxy_pass http://$upstream;
    }
  }

  server {
    listen 5665;
    location / {
      set $upstream k6:5665;
      proxy_pass http://$upstream;
    }
  }
}
