[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 4000
  metric_buffer_limit = 100000
  collection_jitter = "0s"
  flush_interval = "4s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = ""
  omit_hostname = true

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  source_tag = false
  container_name_include = ["quickpizza", "quickpizza-db", "load-testing-workshop-*"]
  container_name_exclude = []
  timeout = "5s"
  perdevice_include = []
  total_include = ["cpu"]
  docker_label_include = []
  docker_label_exclude = ["*"]

[[outputs.influxdb]]
  urls = ["http://victoriametrics:8428"]
  skip_database_creation = true
